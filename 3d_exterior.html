<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>296 Land Plot — 3D Exterior</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; overscroll-behavior: none; }
  #header { padding: 12px 16px; background: #fff; border-bottom: 1px solid #d8d2c2; }
  #header h1 { margin: 0; font-size: 17px; color: #2b2b2b; }
  #header p { margin: 2px 0 0; font-size: 12px; color: #6b6558; }
  #canvas-wrap { position: relative; width: 100%; height: calc(100% - 54px); background: #dfe7ea; touch-action: none; }
  #canvas-wrap canvas { display: block; touch-action: none; }
  #label {
    position: absolute; top: 12px; left: 12px;
    background: rgba(255,255,255,0.92); padding: 6px 12px; border-radius: 6px;
    font-size: 13px; color: #2b2b2b; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    border: 1px solid #d8d2c2; pointer-events: none; display: none;
  }
</style>
</head>
<body>

<div id="header">
  <h1>296 Land Plot — 3D Exterior</h1>
  <p>Drag to rotate · scroll to zoom · hover an opening to see its label &nbsp;·&nbsp; <a href="index.html" style="color:#6b6558;">&larr; back to floor plans</a></p>
</div>
<div id="canvas-wrap">
  <div id="label"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// THREE is now a global, no imports needed

// ---- Real-world dimensions, in meters, taken directly from the floor plans ----
const W = 9, D = 12, FLOOR_H = 3, H = FLOOR_H * 2;

const GLASS = "#a9c6d6";
const DOOR_SOLID = "#36393e";
const WALL = "#9a9891";
const WALL_DARK = "#9a9891";
const ROOF = "#3a3a3a";
const TRIM = "#2a2a2a";

const openings = [
  // FRONT (south, z = D)
  { wall: "front", x0: 1.05, x1: 3.45, y0: 0, y1: 2, type: "door", label: "Living sliding 2.4x2" },
  { wall: "front", x0: 5.55, x1: 7.95, y0: 0, y1: 2, type: "door", label: "Dining sliding 2.4x2" },
  { wall: "front", x0: 1.25, x1: 3.25, y0: FLOOR_H + 0.75, y1: FLOOR_H + 1.95, type: "window", label: "Master 2x1.2" },
  { wall: "front", x0: 5.85, x1: 7.65, y0: FLOOR_H, y1: FLOOR_H + 2, type: "door", label: "Balcony sliding 1.8x2" },
  // BACK (north, z = 0)
  { wall: "back", x0: 4.1, x1: 5.0, y0: 0, y1: 2, type: "door", label: "Kitchen door" },
  { wall: "back", x0: 6.25, x1: 7.75, y0: 0.75, y1: 1.95, type: "window", label: "Kitchen 1.5x1.2" },
  { wall: "back", x0: 2.5, x1: 3.1, y0: FLOOR_H + 0.75, y1: FLOOR_H + 1.95, type: "window", label: "Bed 0.6x1.2" },
  { wall: "back", x0: 3.95, x1: 4.85, y0: FLOOR_H + 1.35, y1: FLOOR_H + 1.95, type: "window", label: "Ensuite 0.9x0.6" },
  { wall: "back", x0: 5.7, x1: 6.3, y0: FLOOR_H + 0.75, y1: FLOOR_H + 1.95, type: "window", label: "Bed 0.6x1.2" },
  // RIGHT (east, x = W) -- distance measured from front (south)
  { wall: "right", x0: D - 8.25, x1: D - 7.35, y0: 0, y1: 2, type: "door", label: "Kitchen side door" },
  { wall: "right", x0: D - 3.9, x1: D - 2.4, y0: 0.75, y1: 1.95, type: "window", label: "Dining 1.5x1.2" },
  { wall: "right", x0: D - 3.9, x1: D - 2.4, y0: FLOOR_H + 0.75, y1: FLOOR_H + 1.95, type: "window", label: "Chill room 1.5x1.2" },
  { wall: "right", x0: D - 10.35, x1: D - 8.85, y0: FLOOR_H + 0.75, y1: FLOOR_H + 1.95, type: "window", label: "Bed 1.5x1.2" },
  // LEFT (west, x = 0)
  { wall: "left", x0: D - 1.4, x1: D - 0.5, y0: 0.75, y1: 1.95, type: "window", label: "Living 0.9x1.2" },
  { wall: "left", x0: D - 5.85, x1: D - 4.65, y0: 0, y1: 2, type: "door", label: "Front door" },
  { wall: "left", x0: D - 7.3, x1: D - 6.7, y0: 1.35, y1: 1.95, type: "window", label: "Bathroom 0.9x0.6" },
  { wall: "left", x0: D - 10.75, x1: D - 9.25, y0: 0.75, y1: 1.95, type: "window", label: "Bed 1.5x1.2" },
  { wall: "left", x0: D - 10.75, x1: D - 9.25, y0: FLOOR_H + 0.75, y1: FLOOR_H + 1.95, type: "window", label: "Bed 1.5x1.2" },
  { wall: "left", x0: D - 7.37, x1: D - 6.47, y0: FLOOR_H + 1.35, y1: FLOOR_H + 1.95, type: "window", label: "Bathroom 0.9x0.6" },
  { wall: "left", x0: D - 5.5, x1: D - 4.6, y0: FLOOR_H + 1.35, y1: FLOOR_H + 1.95, type: "window", label: "Ensuite 0.9x0.6" },
];

function wallToWorld(o) {
  const mid = (o.x0 + o.x1) / 2;
  const h = o.y1 - o.y0;
  const w = o.x1 - o.x0;
  const y = (o.y0 + o.y1) / 2;
  const eps = 0.06;
  if (o.wall === "front") return { size: [w, h, eps], pos: [mid, y, D + eps / 2] };
  if (o.wall === "back") return { size: [w, h, eps], pos: [mid, y, -eps / 2] };
  if (o.wall === "right") return { size: [eps, h, w], pos: [W + eps / 2, y, mid] };
  return { size: [eps, h, w], pos: [-eps / 2, y, mid] };
}

const mount = document.getElementById("canvas-wrap");
const labelEl = document.getElementById("label");
const width = mount.clientWidth, height = mount.clientHeight;

const scene = new THREE.Scene();
scene.background = new THREE.Color("#dfe7ea");
scene.fog = new THREE.Fog("#dfe7ea", 30, 70);

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 768;

const camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: !isMobile });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
renderer.shadowMap.enabled = false;
mount.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight("#ffffff", isMobile ? 1.05 : 0.95));
const fill = new THREE.DirectionalLight("#cfe8ff", 0.35);
fill.position.set(-14, 10, 10);
scene.add(fill);
const fill2 = new THREE.DirectionalLight("#ffffff", 0.3);
fill2.position.set(14, 12, -8);
scene.add(fill2);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshStandardMaterial({ color: "#6f8a5c", roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
ground.receiveShadow = true;
scene.add(ground);

// ---- Lot dimensions (boundary wall removed, kept as reference for driveway placement) ----
const lotX0 = -20, lotX1 = 20, lotZ0 = -16, lotZ1 = 22; // 40m wide x 38m deep block
const gateHalf = 2.5; // 5m wide gate reference, centered on the front

// driveway: matches the site plan's paved shape - a straight 5m-wide strip from the gate,
// widening into a broad apron under the carport/canopy, plus an extra-width turning extension
// on the left (post) side with tapered corners connecting it to the main apron and gate strip.
const paveMat = new THREE.MeshStandardMaterial({ color: "#b7b3a8", roughness: 0.95 }); // matches concreteMat, so the driveway reads as the same paving as the floors around the house
const driveway = new THREE.Group();

function addPaveRect(x0, x1, z0, z1) {
  const w = x1 - x0, d = z1 - z0;
  const slab = new THREE.Mesh(new THREE.PlaneGeometry(w, d), paveMat);
  slab.rotation.x = -Math.PI / 2;
  slab.position.set((x0 + x1) / 2, 0.06, (z0 + z1) / 2); // matches the concrete floor slabs' top surface height (0.06)
  slab.receiveShadow = true;
  driveway.add(slab);
}
function addPaveTri(p1, p2, p3) {
  const shape = new THREE.Shape([p1, p2, p3].map(([x, z]) => new THREE.Vector2(x, -z))); // y negated: rotation.x=-90deg maps shape-Y to -world-Z
  const geo = new THREE.ShapeGeometry(shape);
  const mesh = new THREE.Mesh(geo, paveMat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.y = 0.06; // matches the concrete floor slabs' top surface height
  mesh.receiveShadow = true;
  driveway.add(mesh);
}

addPaveRect(-12, -7, 10, 20);      // straight 5m-wide strip from the gate
addPaveRect(-12, -1.5, -3, 10);    // wide apron under the carport/canopy, up to the paved patio edge
addPaveRect(-14.5, -12, 4, 10);    // extra-width turning extension on the left (post) side
addPaveTri([-14.5, 4], [-12, 4], [-12, 2.333]);   // taper connecting the extension up into the main apron
addPaveTri([-14.5, 10], [-12, 10], [-12, 15]);    // taper connecting the extension down into the gate strip
addPaveTri([-4.5, 10], [-7, 10], [-7, 15]);        // connector triangle: house's front paved patio corner down to the driveway's gate strip edge

scene.add(driveway);


const group = new THREE.Group();
group.position.set(-W / 2, 0, -D / 2);
scene.add(group);

const wallMat = new THREE.MeshStandardMaterial({ color: WALL, roughness: 0.9 });
const houseMesh = new THREE.Mesh(new THREE.BoxGeometry(W, H, D), wallMat);
houseMesh.position.set(W / 2, H / 2, D / 2);
houseMesh.castShadow = true;
houseMesh.receiveShadow = true;
group.add(houseMesh);

const trimGeo = new THREE.BoxGeometry(W + 0.04, 0.06, D + 0.04);
const trimMat = new THREE.MeshStandardMaterial({ color: TRIM });
const trim = new THREE.Mesh(trimGeo, trimMat);
trim.position.set(W / 2, FLOOR_H, D / 2);
group.add(trim);

const ohFront = 1.8, ohBack = 0.8, ohLeft = 0.8, ohRight = 0.8;
const roofW = W + ohLeft + ohRight, roofD = D + ohFront + ohBack;
const roofCenterX = W / 2 + (ohRight - ohLeft) / 2;
const roofCenterZ = D / 2 + (ohFront - ohBack) / 2;
const roof = new THREE.Mesh(
  new THREE.BoxGeometry(roofW, 0.3, roofD),
  new THREE.MeshStandardMaterial({ color: ROOF, roughness: 0.85 })
);
roof.position.set(roofCenterX, H + 0.15, roofCenterZ);
roof.castShadow = true;
group.add(roof);

const parapetMat = new THREE.MeshStandardMaterial({ color: WALL_DARK });
const p1 = new THREE.Mesh(new THREE.BoxGeometry(roofW, 0.4, 0.1), parapetMat);
p1.position.set(roofCenterX, H + 0.5, D + ohFront);
group.add(p1);
const p2 = new THREE.Mesh(new THREE.BoxGeometry(roofW, 0.4, 0.1), parapetMat);
p2.position.set(roofCenterX, H + 0.5, -ohBack);
group.add(p2);
const p3 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, roofD), parapetMat);
p3.position.set(-ohLeft, H + 0.5, roofCenterZ);
group.add(p3);
const p4 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, roofD), parapetMat);
p4.position.set(W + ohRight, H + 0.5, roofCenterZ);
group.add(p4);

// ---- Rooftop terrace roof: single flat (very gently sloped) panel spanning the full terrace footprint.
// Replaces the earlier split-level design, which left most of the back half of the terrace under 2m clearance
// (dropping to 1.3m at the back wall) - unusable for a terrace meant for moving around, relaxing, eating, drinking.
// A flat roof also matches the house's established style (flat main roof deck, parapets, shallow-slope canopies
// throughout) rather than introducing a mismatched pitched/gable form. ----
const deckY = H + 0.3; // sits on top of the existing flat roof deck
const terraceRoofMat = new THREE.MeshStandardMaterial({ color: ROOF, roughness: 0.85, side: THREE.DoubleSide });
const terracePostMat = new THREE.MeshStandardMaterial({ color: TRIM });

const terraceZ0 = -ohBack, terraceZ1 = D + ohFront; // full depth including both overhangs
const terraceRoofBackH = 2.4;  // clearance at the back edge
const terraceRoofFrontH = 2.2; // clearance at the front edge - very slight drop (0.2m over 14.6m, <1 degree) for drainage only
const terraceRoofDrop = terraceRoofBackH - terraceRoofFrontH;
const terraceRoofDepth = terraceZ1 - terraceZ0;

const terraceRoof = new THREE.Mesh(
  new THREE.BoxGeometry(roofW, 0.15, terraceRoofDepth),
  terraceRoofMat
);
terraceRoof.rotation.x = Math.atan2(terraceRoofDrop, terraceRoofDepth);
terraceRoof.position.set(roofCenterX, deckY + (terraceRoofBackH + terraceRoofFrontH) / 2, (terraceZ0 + terraceZ1) / 2);
terraceRoof.castShadow = true;
group.add(terraceRoof);

function terraceHeightAt(z) {
  const t = (z - terraceZ0) / terraceRoofDepth;
  return terraceRoofBackH - terraceRoofDrop * t;
}

// support posts along both long edges only, spaced every ~3.6m, keeping the terrace open in the middle
const terracePostZs = [terraceZ0 + 0.3, 3, 6.5, 10, terraceZ1 - 0.3];
[-ohLeft + 0.3, W + ohRight - 0.3].forEach((px) => {
  terracePostZs.forEach((pz) => {
    const pclear = terraceHeightAt(pz);
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, pclear, 8), terracePostMat);
    post.position.set(px, deckY + pclear / 2, pz);
    group.add(post);
  });
});

openings.forEach((o) => {
  const { size, pos } = wallToWorld(o);
  const isGlassDoor = o.type === "door" && o.label.toLowerCase().includes("sliding");
  const isGlass = o.type === "window" || isGlassDoor;
  const isFrontBack = o.wall === "front" || o.wall === "back";
  const outward = o.wall === "front" ? 1 : o.wall === "back" ? -1 : o.wall === "right" ? 1 : -1;

  const pad = 0.06;
  const frameMat = new THREE.MeshStandardMaterial({ color: TRIM });
  const frameSize = isFrontBack
    ? [size[0] + pad, size[1] + pad, size[2]]
    : [size[0], size[1] + pad, size[2] + pad];
  const frameMesh = new THREE.Mesh(new THREE.BoxGeometry(...frameSize), frameMat);
  frameMesh.position.set(...pos);
  group.add(frameMesh);

  const glassMat = isGlass
    ? new THREE.MeshBasicMaterial({ color: GLASS })
    : new THREE.MeshBasicMaterial({ color: DOOR_SOLID });
  const glassPos = [...pos];
  const offsetAxis = isFrontBack ? 2 : 0;
  glassPos[offsetAxis] += outward * 0.02;
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(...size), glassMat);
  mesh.position.set(...glassPos);
  mesh.userData.label = o.label;
  group.add(mesh);
});

const shadeMat = new THREE.MeshStandardMaterial({ color: ROOF, roughness: 0.85 });
const postMat = new THREE.MeshStandardMaterial({ color: TRIM });
const CANOPY_SLOPE = Math.tan(12 * Math.PI / 180); // ~12 degrees on a 2.5m-deep panel - the reference slope that reads correctly
const CANOPY_DROP = 2.5 * CANOPY_SLOPE; // reference drop for a 2.5m panel at 12 degrees; only used directly for the carport now (see carportDrop) and to derive LOW_SLOPE_RATIO
const carportW = 6; // declared early so the low-slope ratio below can reference it
const LOW_SLOPE_RATIO = CANOPY_DROP / carportW; // the carport's gentler slope angle (~5 degrees), reused for the back/right/corner pieces so they match it
function addShade(x0, x1, depth, yTop) {
  const w = x1 - x0;
  const drop = depth * LOW_SLOPE_RATIO;
  const slab = new THREE.Mesh(new THREE.BoxGeometry(w, 0.12, depth), shadeMat);
  slab.position.set((x0 + x1) / 2, yTop - drop / 2, -depth / 2);
  slab.rotation.x = -Math.atan2(drop, depth);
  slab.castShadow = true;
  group.add(slab);
  [x0 + 0.15, (x0 + x1) / 2, x1 - 0.15].forEach((px) => {
    const postH = yTop - drop * ((depth - 0.15) / depth); // slab height at this post's distance from the wall, not the flat wall height
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, postH, 8), postMat);
    post.position.set(px, postH / 2, -depth + 0.15);
    group.add(post);
  });
}
addShade(0, 9, 2.5, FLOOR_H - 0.05);

// ---- Continuous wraparound shade roof at ground floor ceiling height, same depth/style as the back (outdoor kitchen) shade ----
const gfShadeY = FLOOR_H - 0.05, gfShadeDepth = 2.5;
function addShadeSide(wall, span0, span1, depthOverride) {
  const span = span1 - span0;
  const depth = depthOverride || gfShadeDepth;
  const isNS = wall === "front" || wall === "back"; // slab runs along X, projects in Z
  const drop = depth * LOW_SLOPE_RATIO; // same ~5 degree slope for every side, including front, so the whole ground-floor canopy reads as one consistent roofline
  const geo = new THREE.BoxGeometry(isNS ? span : depth, 0.12, isNS ? depth : span);
  const slab = new THREE.Mesh(geo, shadeMat);
  slab.castShadow = true;
  const mid = (span0 + span1) / 2;
  const postPositions = [];
  if (wall === "front") {
    slab.position.set(mid, gfShadeY - drop / 2, D + depth / 2);
    slab.rotation.x = Math.atan2(drop, depth);
    postPositions.push([span0 + 0.15, D + depth - 0.15], [mid, D + depth - 0.15], [span1 - 0.15, D + depth - 0.15]);
  } else if (wall === "right") {
    slab.position.set(W + depth / 2, gfShadeY - drop / 2, mid);
    slab.rotation.z = -Math.atan2(drop, depth);
    postPositions.push([W + depth - 0.15, span0 + 0.15], [W + depth - 0.15, span1 - 0.15], [W + depth - 0.15, span0 + span * (1 / 3)], [W + depth - 0.15, span0 + span * (2 / 3)]);
  } else if (wall === "left") {
    slab.position.set(-depth / 2, gfShadeY - drop / 2, mid);
    slab.rotation.z = Math.atan2(drop, depth);
    postPositions.push([-depth + 0.15, span0 + 0.15], [-depth + 0.15, span1 - 0.15]);
  }
  group.add(slab);
  const postH = gfShadeY - drop * ((depth - 0.15) / depth); // slab height at each post's distance from the wall, not the flat wall height
  postPositions.forEach(([px, pz]) => {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, postH, 8), postMat);
    post.position.set(px, postH / 2, pz);
    group.add(post);
  });
}
const frontCanopyDepth = 3; // shortened from 4m so a level/relaxed sofa gaze clears under it to open sky
const frontPavingDepth = 4; // paved patio extends past the roofline, uncovered but usable, for outdoor furniture
addShadeSide("front", 0, W, frontCanopyDepth);
addShadeSide("right", 0, D);

// ---- Square (90 degree) corner panel: extends both adjacent canopies to meet at a right angle,
// with a hip ridge running from the wall corner (high point) down to the outer corner (low point) ----
const hipCornerMat = new THREE.MeshStandardMaterial({ color: ROOF, roughness: 0.85, side: THREE.DoubleSide });
function addHipCorner(innerX, innerZ, outerX, outerZ, dropZ, dropX, topY) {
  const dropPost = (dropZ + dropX) / 2;
  const geo = new THREE.BufferGeometry();
  const P1 = [innerX, topY, innerZ];               // wall corner - high point
  const P2 = [innerX, topY - dropZ, outerZ];        // low point, matches the Z-facing neighbor's edge height
  const P3 = [outerX, topY - dropPost, outerZ];     // outer corner - low point
  const P4 = [outerX, topY - dropX, innerZ];        // low point, matches the X-facing neighbor's edge height
  const vertices = new Float32Array([
    ...P1, ...P2, ...P3,
    ...P1, ...P3, ...P4,
  ]);
  geo.setAttribute("position", new THREE.BufferAttribute(vertices, 3));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, hipCornerMat);
  mesh.castShadow = true;
  group.add(mesh);

  // support post at the outer corner (P3), inset 0.15m toward the building along each axis, at the slab's actual height there
  const signX = Math.sign(outerX - innerX), signZ = Math.sign(outerZ - innerZ);
  const postH = topY - dropPost;
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, postH, 8), postMat);
  post.position.set(outerX - signX * 0.15, postH / 2, outerZ - signZ * 0.15);
  group.add(post);

  return mesh;
}

// corner piece connecting the back shade and right shade roofs at the back-right corner
const cornerDropStd = gfShadeDepth * LOW_SLOPE_RATIO; // matches the now carport-slope back/right sides (all 2.5m deep)
addHipCorner(W, 0, W + gfShadeDepth, -gfShadeDepth, cornerDropStd, cornerDropStd, gfShadeY);

// corner piece connecting the front shade (3m) and right shade (2.5m) roofs at the front-right corner
const frontDrop = frontCanopyDepth * LOW_SLOPE_RATIO; // matches the front canopy's now-uniform ~5 degree slope
addHipCorner(W, D, W + gfShadeDepth, D + frontCanopyDepth, frontDrop, cornerDropStd, gfShadeY);

const carportTopY = gfShadeY;
const cz0 = D - 9, cz1 = D - 2;
const carportDrop = CANOPY_DROP; // fixed drop, not scaled to the 6m span, so it isn't over-steep
const carportSlab = new THREE.Mesh(
  new THREE.BoxGeometry(carportW, 0.12, cz1 - cz0),
  shadeMat
);
carportSlab.position.set(-carportW / 2, carportTopY - carportDrop / 2, (cz0 + cz1) / 2);
carportSlab.rotation.z = Math.atan2(carportDrop, carportW);
carportSlab.castShadow = true;
group.add(carportSlab);
[
  [-carportW + 0.15, cz0 + 0.15], [-carportW + 0.15, cz1 - 0.15],
].forEach(([px, pz]) => {
  const postH = carportTopY - carportDrop * ((carportW - 0.15) / carportW); // slab height at this post's distance from the wall
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, postH, 8), postMat);
  post.position.set(px, postH / 2, pz);
  group.add(post);
});

// bridge connecting the carport roof to the back shade extension: steps down from the carport's 6m width to the standard 2.5m wraparound width
const bridgeDrop = gfShadeDepth * (carportDrop / carportW); // same slope angle as the carport, not just the same absolute drop
const bridgeSlab = new THREE.Mesh(
  new THREE.BoxGeometry(gfShadeDepth, 0.12, cz0),
  shadeMat
);
bridgeSlab.position.set(-gfShadeDepth / 2, carportTopY - bridgeDrop / 2, cz0 / 2);
bridgeSlab.rotation.z = Math.atan2(bridgeDrop, gfShadeDepth);
bridgeSlab.castShadow = true;
group.add(bridgeSlab);
const bridgePostH = carportTopY - bridgeDrop * ((gfShadeDepth - 0.15) / gfShadeDepth); // slab height at this post's distance from the wall
const bridgePost = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, bridgePostH, 8), postMat);
bridgePost.position.set(-gfShadeDepth + 0.15, bridgePostH / 2, 0.15);
group.add(bridgePost);
// support post where a line from the carport's top-left post (toward the house) meets a line down from the bridge post (toward the car)
{
  const px = -gfShadeDepth + 0.15, pz = cz0 + 0.15; // this point sits under the carport roof, just past the bridge's own footprint

const canopyMat = new THREE.MeshStandardMaterial({ color: ROOF, roughness: 0.85 });
const bracketMat = new THREE.MeshStandardMaterial({ color: TRIM });
function addCanopy(wall, span0, span1, topY, projection) {
  const width = span1 - span0;
  const mid = (span0 + span1) / 2;
  const isNS = wall === "front" || wall === "back";
  const geo = new THREE.BoxGeometry(
    isNS ? width + 0.3 : projection,
    0.08,
    isNS ? projection : width + 0.3
  );
  const canopy = new THREE.Mesh(geo, canopyMat);
  canopy.castShadow = true;
  const ffDrop = projection * LOW_SLOPE_RATIO; // same ~5 degree slope as the ground floor canopy, instead of the old fixed 16.7 degree drop
  const brackets = [];
  if (wall === "front") {
    canopy.position.set(mid, topY - ffDrop / 2, D + projection / 2);
    canopy.rotation.x = Math.atan2(ffDrop, projection);
    brackets.push([span0 + 0.1, D + 0.05], [span1 - 0.1, D + 0.05]);
  } else if (wall === "right") {
    canopy.position.set(W + projection / 2, topY - ffDrop / 2, mid);
    canopy.rotation.z = -Math.atan2(ffDrop, projection);
    brackets.push([W + 0.05, span0 + 0.1], [W + 0.05, span1 - 0.1]);
  } else if (wall === "left") {
    canopy.position.set(-projection / 2, topY - ffDrop / 2, mid);
    canopy.rotation.z = Math.atan2(ffDrop, projection);
    brackets.push([-0.05, span0 + 0.1], [-0.05, span1 - 0.1]);
  } else if (wall === "back") {
    canopy.position.set(mid, topY - ffDrop / 2, -projection / 2);
    canopy.rotation.x = -Math.atan2(ffDrop, projection);
    brackets.push([span0 + 0.1, -0.05], [span1 - 0.1, -0.05]);
  }
  group.add(canopy);
  brackets.forEach(([bx, bz]) => {
    const bracket = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.3, 0.04), bracketMat);
    bracket.position.set(bx, topY - 0.15, bz);
    group.add(bracket);
  });
}

let theta = Math.PI / 4, phi = 1.1, radius = 22;
let dragging = false, lastX = 0, lastY = 0;
function updateCamera() {
  const cx = radius * Math.sin(phi) * Math.sin(theta);
  const cz = radius * Math.sin(phi) * Math.cos(theta);
  const cy = radius * Math.cos(phi);
  camera.position.set(cx, cy, cz);
  camera.lookAt(0, 2.5, 0);
}
updateCamera();

const dom = renderer.domElement;

// ---- Desktop: mouse drag to rotate, wheel to zoom ----
dom.addEventListener("mousedown", (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener("mouseup", () => { dragging = false; });
window.addEventListener("mousemove", (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  theta -= dx * 0.006;
  phi = Math.min(Math.max(phi - dy * 0.006, 0.35), 1.5);
  lastX = e.clientX; lastY = e.clientY;
  updateCamera();
});
dom.addEventListener("wheel", (e) => {
  e.preventDefault();
  radius = Math.min(Math.max(radius + e.deltaY * 0.02, 10), 40);
  updateCamera();
}, { passive: false });

// ---- Mobile: native touch events, one finger to rotate, two fingers to pinch-zoom ----
let pinchStartDist = 0, pinchStartRadius = 0;
function touchDist(t0, t1) {
  const dx = t0.clientX - t1.clientX, dy = t0.clientY - t1.clientY;
  return Math.sqrt(dx * dx + dy * dy);
}
dom.addEventListener("touchstart", (e) => {
  e.preventDefault();
  if (e.touches.length === 1) {
    dragging = true;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    dragging = false;
    pinchStartDist = touchDist(e.touches[0], e.touches[1]);
    pinchStartRadius = radius;
  }
}, { passive: false });
dom.addEventListener("touchmove", (e) => {
  e.preventDefault();
  if (e.touches.length === 2) {
    const dist = touchDist(e.touches[0], e.touches[1]);
    const scale = pinchStartDist / Math.max(dist, 1);
    radius = Math.min(Math.max(pinchStartRadius * scale, 10), 40);
    updateCamera();
    return;
  }
  if (e.touches.length === 1 && dragging) {
    const dx = e.touches[0].clientX - lastX, dy = e.touches[0].clientY - lastY;
    theta -= dx * 0.006;
    phi = Math.min(Math.max(phi - dy * 0.006, 0.35), 1.5);
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    updateCamera();
  }
}, { passive: false });
dom.addEventListener("touchend", (e) => {
  if (e.touches.length === 1) {
    dragging = true;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  } else {
    dragging = false;
  }
}, { passive: false });
dom.addEventListener("touchcancel", () => { dragging = false; }, { passive: false });

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
dom.addEventListener("pointermove", (e) => {
  if (e.pointerType === "touch" || dragging) {
    labelEl.style.display = "none";
    return;
  }
  const rect = dom.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(group.children, false).filter(h => h.object.userData.label);
  if (hits.length) {
    labelEl.textContent = hits[0].object.userData.label;
    labelEl.style.display = "block";
  } else {
    labelEl.style.display = "none";
  }
});

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  const w = mount.clientWidth, h = mount.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
