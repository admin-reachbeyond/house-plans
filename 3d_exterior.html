<body>

<div id="header">
  <h1>296 Land Plot — 3D Exterior</h1>
  <p>Drag to rotate · scroll to zoom · hover an opening to see its label &nbsp;·&nbsp; <a href="index.html" style="color:#6b6558;">&larr; back to floor plans</a></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// THREE is now a global, no imports needed

// ---- Real-world dimensions, in meters, taken directly from the floor plans ----
const W = 9, D = 12, FLOOR_H = 3, H = FLOOR_H * 2;

const GLASS = "#a9c6d6";
const DOOR_SOLID = "#36393e";
const WALL = "#9a9891";
const WALL_DARK = "#9a9891";
const ROOF = "#3a3a3a";
const TRIM = "#2a2a2a";

const openings = [
  // FRONT (south, z = D)
  { wall: "front", x0: 1.05, x1: 3.45, y0: 0, y1: 2, type: "door", label: "Living sliding 2.4x2" },
  { wall: "front", x0: 5.55, x1: 7.95, y0: 0, y1: 2, type: "door", label: "Dining sliding 2.4x2" },
  { wall: "front", x0: 1.5, x1: 3.0, y0: FLOOR_H + 0.75, y1: FLOOR_H + 1.95, type: "window", label: "Master 1.5x1.2" },
  { wall: "front", x0: 5.85, x1: 7.65, y0: FLOOR_H, y1: FLOOR_H + 2, type: "door", label: "Balcony sliding 1.8x2" },
  // BACK (north, z = 0)
  { wall: "back", x0: 4.1, x1: 5.0, y0: 0, y1: 2, type: "door", label: "Kitchen door" },
  { wall: "back", x0: 6.25, x1: 7.75, y0: 0.75, y1: 1.95, type: "window", label: "Kitchen 1.5x1.2" },
  { wall: "back", x0: 2.5, x1: 3.1, y0: FLOOR_H + 0.75, y1: FLOOR_H + 1.95, type: "window", label: "Bed 0.6x1.2" },
  { wall: "back", x0: 3.95, x1: 4.85, y0: FLOOR_H + 1.35, y1: FLOOR_H + 1.95, type: "window", label: "Ensuite 0.9x0.6" },
  { wall: "back", x0: 5.7, x1: 6.3, y0: FLOOR_H + 0.75, y1: FLOOR_H + 1.95, type: "window", label: "Bed 0.6x1.2" },
  // RIGHT (east, x = W) -- distance measured from front (south)
  { wall: "right", x0: D - 8.25, x1: D - 7.35, y0: 0, y1: 2, type: "door", label: "Kitchen side door" },
  { wall: "right", x0: D - 3.9, x1: D - 2.4, y0: 0.75, y1: 1.95, type: "window", label: "Dining 1.5x1.2" },
  { wall: "right", x0: 5.1, x1: 5.7, y0: 3.45, y1: 4.65, type: "window", label: "Stair void feature window 0.6x1.2" },
  { wall: "right", x0: D - 3.9, x1: D - 2.4, y0: FLOOR_H + 0.75, y1: FLOOR_H + 1.95, type: "window", label: "Chill room 1.5x1.2" },
  { wall: "right", x0: D - 10.35, x1: D - 8.85, y0: FLOOR_H + 0.75, y1: FLOOR_H + 1.95, type: "window", label: "Bed 1.5x1.2" },
  // LEFT (west, x = 0)
  { wall: "left", x0: D - 1.4, x1: D - 0.5, y0: 0.75, y1: 1.95, type: "window", label: "Living 0.9x1.2" },
  { wall: "left", x0: D - 5.85, x1: D - 4.65, y0: 0, y1: 2, type: "door", label: "Front door" },
  { wall: "left", x0: D - 7.3, x1: D - 6.7, y0: 1.35, y1: 1.95, type: "window", label: "Bathroom 0.9x0.6" },
  { wall: "left", x0: D - 10.75, x1: D - 9.25, y0: 0.75, y1: 1.95, type: "window", label: "Bed 1.5x1.2" },
  { wall: "left", x0: D - 10.75, x1: D - 9.25, y0: FLOOR_H + 0.75, y1: FLOOR_H + 1.95, type: "window", label: "Bed 1.5x1.2" },
  { wall: "left", x0: D - 7.37, x1: D - 6.47, y0: FLOOR_H + 1.35, y1: FLOOR_H + 1.95, type: "window", label: "Bathroom 0.9x0.6" },
  { wall: "left", x0: D - 2.75, x1: D - 1.25, y0: FLOOR_H + 0.75, y1: FLOOR_H + 1.95, type: "window", label: "Master 1.5x1.2" },
  { wall: "left", x0: D - 5.5, x1: D - 4.6, y0: FLOOR_H + 1.35, y1: FLOOR_H + 1.95, type: "window", label: "Ensuite 0.9x0.6" },
];

function wallToWorld(o) {
  const mid = (o.x0 + o.x1) / 2;
  const h = o.y1 - o.y0;
  const w = o.x1 - o.x0;
  const y = (o.y0 + o.y1) / 2;
  const eps = 0.06;
  if (o.wall === "front") return { size: [w, h, eps], pos: [mid, y, D + eps / 2] };
  if (o.wall === "back") return { size: [w, h, eps], pos: [mid, y, -eps / 2] };
  if (o.wall === "right") return { size: [eps, h, w], pos: [W + eps / 2, y, mid] };
  return { size: [eps, h, w], pos: [-eps / 2, y, mid] };
}

const mount = document.getElementById("canvas-wrap");
const labelEl = document.getElementById("label");
const width = mount.clientWidth, height = mount.clientHeight;

const scene = new THREE.Scene();
scene.background = new THREE.Color("#dfe7ea");
scene.fog = new THREE.Fog("#dfe7ea", 30, 70);

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 768;

const camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: !isMobile });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
renderer.shadowMap.enabled = false;
mount.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight("#ffffff", isMobile ? 1.05 : 0.95));
const fill = new THREE.DirectionalLight("#cfe8ff", 0.35);
fill.position.set(-14, 10, 10);
scene.add(fill);
const fill2 = new THREE.DirectionalLight("#ffffff", 0.3);
fill2.position.set(14, 12, -8);
scene.add(fill2);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshStandardMaterial({ color: "#6f8a5c", roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
ground.receiveShadow = true;
scene.add(ground);

// ---- Lot dimensions (boundary wall removed, kept as reference for driveway placement) ----
const lotX0 = -20, lotX1 = 20, lotZ0 = -16, lotZ1 = 22; // 40m wide x 38m deep block
const gateHalf = 2.5; // 5m wide gate reference, centered on the front

// driveway: matches the site plan's paved shape - a straight 5m-wide strip from the gate,
// widening into a broad apron under the carport/canopy, plus an extra-width turning extension
// on the left (post) side with tapered corners connecting it to the main apron and gate strip.
const paveMat = new THREE.MeshStandardMaterial({ color: "#b7b3a8", roughness: 0.95 }); // matches concreteMat, so the driveway reads as the same paving as the floors around the house
const driveway = new THREE.Group();

function addPaveRect(x0, x1, z0, z1) {
  const w = x1 - x0, d = z1 - z0;
  const slab = new THREE.Mesh(new THREE.PlaneGeometry(w, d), paveMat);
  slab.rotation.x = -Math.PI / 2;
  slab.position.set((x0 + x1) / 2, 0.06, (z0 + z1) / 2); // matches the concrete floor slabs' top surface height (0.06)
  slab.receiveShadow = true;
  driveway.add(slab);
}
function addPaveTri(p1, p2, p3) {
  const shape = new THREE.Shape([p1, p2, p3].map(([x, z]) => new THREE.Vector2(x, -z))); // y negated: rotation.x=-90deg maps shape-Y to -world-Z
  const geo = new THREE.ShapeGeometry(shape);
  const mesh = new THREE.Mesh(geo, paveMat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.y = 0.06; // matches the concrete floor slabs' top surface height
  mesh.receiveShadow = true;
  driveway.add(mesh);
}

addPaveRect(-12, -7, 10, 20);      // straight 5m-wide strip from the gate
addPaveRect(-12, -1.5, -3, 10);    // wide apron under the carport/canopy, up to the paved patio edge
addPaveRect(-14.5, -12, 4, 10);    // extra-width turning extension on the left (post) side
addPaveTri([-14.5, 4], [-12, 4], [-12, 2.333]);   // taper connecting the extension up into the main apron
addPaveTri([-14.5, 10], [-12, 10], [-12, 15]);    // taper connecting the extension down into the gate strip
addPaveTri([-4.5, 10], [-7, 10], [-7, 15]);        // connector triangle: house's front paved patio corner down to the driveway's gate strip edge

scene.add(driveway);


const group = new THREE.Group();
group.position.set(-W / 2, 0, -D / 2);
scene.add(group);

const wallMat = new THREE.MeshStandardMaterial({ color: WALL, roughness: 0.9 });
const houseMesh = new THREE.Mesh(new THREE.BoxGeometry(W, H, D), wallMat);
houseMesh.position.set(W / 2, H / 2, D / 2);
houseMesh.castShadow = true;
houseMesh.receiveShadow = true;
group.add(houseMesh);

const trimGeo = new THREE.BoxGeometry(W + 0.04, 0.06, D + 0.04);
const trimMat = new THREE.MeshStandardMaterial({ color: TRIM });
const trim = new THREE.Mesh(trimGeo, trimMat);
trim.position.set(W / 2, FLOOR_H, D / 2);
group.add(trim);

const ohFront = 1.6, ohBack = 0.8, ohLeft = 0.8, ohRight = 0.8;
const roofW = W + ohLeft + ohRight, roofD = D + ohFront + ohBack;
const roofCenterX = W / 2 + (ohRight - ohLeft) / 2;
const roofCenterZ = D / 2 + (ohFront - ohBack) / 2;
const roof = new THREE.Mesh(
  new THREE.BoxGeometry(roofW, 0.3, roofD),
  new THREE.MeshStandardMaterial({ color: ROOF, roughness: 0.85 })
);
roof.position.set(roofCenterX, H + 0.15, roofCenterZ);
roof.castShadow = true;
group.add(roof);

const parapetMat = new THREE.MeshStandardMaterial({ color: WALL_DARK });
const p1 = new THREE.Mesh(new THREE.BoxGeometry(roofW, 0.4, 0.1), parapetMat);
p1.position.set(roofCenterX, H + 0.5, D + ohFront);
group.add(p1);
const p2 = new THREE.Mesh(new THREE.BoxGeometry(roofW, 0.4, 0.1), parapetMat);
p2.position.set(roofCenterX, H + 0.5, -ohBack);
group.add(p2);
const p3 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, roofD), parapetMat);
p3.position.set(-ohLeft, H + 0.5, roofCenterZ);
group.add(p3);
const p4 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, roofD), parapetMat);
p4.position.set(W + ohRight, H + 0.5, roofCenterZ);
group.add(p4);

// ---- Split-level roof over the rooftop terrace: both sections sloped, shorter/lower at front, longer/higher at back.
// Restored per user request (preferred the look over the flat-roof alternative). Every height below is the
// flat-roof-era value +0.6m, a uniform vertical shift that keeps the original slope angles and step proportions
// identical but raises the two lowest points - the back wall and the front wall - to exactly 2m clearance
// (previously 1.4m at both, which was too low to stand near comfortably). ----
const splitZ = 8.0; // meters from back wall (z=0); matches tankBoxZ1, the utility room's front wall, so the roof step lines up cleanly with it. front section covers z=splitZ..D, back section covers z=0..splitZ
const deckY = H + 0.3; // sits on top of the existing flat roof deck
const roofMat2 = new THREE.MeshStandardMaterial({ color: ROOF, roughness: 0.85, side: THREE.DoubleSide });
const postMat2 = new THREE.MeshStandardMaterial({ color: TRIM });
const bandMat = new THREE.MeshStandardMaterial({ color: WALL_DARK, roughness: 0.9 });

// height (above deckY) at each key point along the depth, both sections sloping down toward the front (+z)
const backRidgeH = 2.0;   // at z=0 (back wall) - the lowest point of the back section, 2m clear
const backEaveH = 2.5;    // at z=splitZ (top of the step) - dropped 0.5m from the first pass (was 3.0)
const frontRidgeH = 2.1;  // at z=splitZ (bottom of the step, start of front section) - dropped 0.5m (was 2.6)
const frontEaveH = 2.0;   // at z=D (front wall) - the lowest point of the front section, 2m clear

function slopedPanel(z0, z1, h0, h1, extendStart, extendEnd) {
  const rate = (h1 - h0) / (z1 - z0);
  const zA = z0 - extendStart, zB = z1 + extendEnd;
  const hA = h0 - rate * extendStart, hB = h1 + rate * extendEnd;
  const depth = zB - zA;
  const geo = new THREE.BoxGeometry(W + ohLeft + ohRight, 0.15, depth);
  const mesh = new THREE.Mesh(geo, roofMat2);
  mesh.rotation.x = -Math.atan2(hB - hA, depth);
  mesh.position.set(W / 2, deckY + (hA + hB) / 2, (zA + zB) / 2);
  mesh.castShadow = true;
  return mesh;
}

// back (longer/higher) sloped panel: z=0 (ridge) -> z=splitZ (eave), overhangs past the back wall
group.add(slopedPanel(0, splitZ, backRidgeH, backEaveH, ohBack, 0));
// front (shorter/lower) sloped panel: z=splitZ (ridge) -> z=D (eave), overhangs past the front wall to match the balcony coverage below
group.add(slopedPanel(splitZ, D, frontRidgeH, frontEaveH, 0, ohFront));

// vertical clerestory band connecting the two heights, running the full width at z = splitZ
const band = new THREE.Mesh(
  new THREE.BoxGeometry(W + ohLeft + ohRight, backEaveH - frontRidgeH, 0.12),
  bandMat
);
band.position.set(W / 2, deckY + frontRidgeH + (backEaveH - frontRidgeH) / 2, splitZ);
group.add(band);

// support posts, height interpolated to match the slope at each post's position
function heightAt(z) {
  if (z <= splitZ) return backRidgeH + (backEaveH - backRidgeH) * (z / splitZ);
  return frontRidgeH + (frontEaveH - frontRidgeH) * ((z - splitZ) / (D - splitZ));
}
// Left/east edge (x=0.3): 7 posts, evenly spaced across the full depth
const edgeInset = 0.3;
const postZStart = -ohBack + edgeInset;
const postZEnd = D + ohFront - edgeInset;
// First post is the back corner; next 3 are evenly spaced between it and the clerestory-aligned post;
// that post lines up with the utility room's front wall; last is the front corner, with the middle
// post lined up with the right edge's middle post
const backSpan = splitZ - postZStart;
const leftEdgePosts = [
  [0.3, postZStart],
  [0.3, postZStart + (1 / 4) * backSpan],
  [0.3, postZStart + (2 / 4) * backSpan],
  [0.3, postZStart + (3 / 4) * backSpan],
  [0.3, splitZ], // lines up with the utility room's front wall
  [0.3, (splitZ + postZEnd) / 2], // lines up with the right edge's middle post
  [0.3, postZEnd],
];
// Right/west edge (x=W-0.3): 4 posts. Skips z=3.5-8.0 (utility room footprint) entirely, including the
// two corner points, since the room's own wall runs straight up to meet the roof there with no gap.
// One fills the gap between the back corner and the room's north wall; the other is centered between
// the room's front wall and the front corner post.
const rightEdgePosts = [
  [W - 0.3, postZStart], [W - 0.3, (postZStart + (3.5 - edgeInset)) / 2],
  [W - 0.3, (splitZ + postZEnd) / 2], [W - 0.3, postZEnd],
];
// Intermediate posts along the back/front edges
const intermediatePosts = [
  [3.1, postZStart], [5.9, postZStart], [3.1, postZEnd], [5.9, postZEnd],
];
// Centerline posts, at the clerestory step
const centerlinePosts = [
  [W / 2, 4.1], [W / 2, splitZ],
];
[...leftEdgePosts, ...rightEdgePosts, ...intermediatePosts, ...centerlinePosts].forEach(([px, pz]) => {
  const pclear = heightAt(pz);
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, pclear, 8), postMat2);
  post.position.set(px, deckY + pclear / 2, pz);
  group.add(post);
});

// ---- Rooftop stair access enclosure: fully enclosed box housing the top of the first-floor -> rooftop stairs.
// Positioned to match the actual stair arrival point from the floor plan (index.html): against the right/west
// wall (x=W=9), about 4.5m down from the back-right corner (z=0 at the back wall), under the back section of
// the terrace roof. Walls now run all the way up to meet the sloped roof underside (rather than stopping flat
// partway up), using a custom sloped-top wall geometry that tracks heightAt(z) exactly along their length, so
// there's no gap between the walls and the roof. Door faces east (-x), opening directly onto the open terrace. ----
const stairBoxX0 = 6.6, stairBoxX1 = W;       // extended 0.4m further left/east (was 7.0)
const stairBoxZ0 = 3.5, stairBoxZ1 = 6.0;     // extended 1m further north (was z=4.5) - the second flight runs
                                               // parallel to the right wall and arrives at z=4.5 facing north,
                                               // so this gives 1m of turning space to reach the door on the left (east)
const stairBoxCenterX = (stairBoxX0 + stairBoxX1) / 2;
const stairBoxCenterZ = (stairBoxZ0 + stairBoxZ1) / 2;
const stairBoxWidth = stairBoxX1 - stairBoxX0;
const stairBoxDepth = stairBoxZ1 - stairBoxZ0;

const stairWallMat = new THREE.MeshStandardMaterial({ color: WALL, roughness: 0.9, side: THREE.DoubleSide });
const stairDoorMat = new THREE.MeshStandardMaterial({ color: DOOR_SOLID, roughness: 0.6 });

// Builds a wall running along Z (from z0 to z1) at a fixed X, whose top edge follows heightAt(z) exactly -
// i.e. it meets the sloped roof underside with no gap, instead of a flat top. baseH is the wall's starting
// height above the deck (0 for a full wall, doorH for a header sitting above a doorway).
function slopedWallAlongZ(centerX, thickness, z0, z1, baseH, mat) {
  const b = deckY + baseH;
  const h0 = deckY + heightAt(z0), h1 = deckY + heightAt(z1);
  const x0 = centerX - thickness / 2, x1 = centerX + thickness / 2;
  const A = [x0, b, z0], B = [x1, b, z0], C = [x1, b, z1], D = [x0, b, z1];
  const E = [x0, h0, z0], F = [x1, h0, z0], G = [x1, h1, z1], H = [x0, h1, z1];
  const pos = [];
  const quad = (p1, p2, p3, p4) => { pos.push(...p1, ...p2, ...p3, ...p1, ...p3, ...p4); };
  quad(A, D, C, B); // bottom
  quad(E, F, G, H); // sloped top
  quad(A, B, F, E); // z0 end face
  quad(D, H, G, C); // z1 end face
  quad(A, E, H, D); // x0 side face
  quad(B, C, G, F); // x1 side face
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, mat);
}

// north wall (z = stairBoxZ0) - flat top, since height only depends on z and z is constant along this wall
const stairWallNH = heightAt(stairBoxZ0);
const stairWallN = new THREE.Mesh(new THREE.BoxGeometry(stairBoxWidth, stairWallNH, 0.12), stairWallMat);
stairWallN.position.set(stairBoxCenterX, deckY + stairWallNH / 2, stairBoxZ0);
group.add(stairWallN);

// (no interior south wall here anymore - merged with the tank compartment below into one room)

// west wall (x = stairBoxX1 = W): sloped top, running the full depth of the merged room (stair + tank)
const stairWallW = slopedWallAlongZ(stairBoxX1, 0.12, stairBoxZ0, stairBoxZ1 + 2.0, 0, stairWallMat);
group.add(stairWallW);

// east wall (x = stairBoxX0), with a 0.9m x 2.0m door opening centered on it, built from two sloped-top side
// panels + a sloped-top header panel above the door rather than a single solid wall
const doorW = 0.9, doorH = 2.0;
const sidePanelDepth = (stairBoxDepth - doorW) / 2;
if (sidePanelDepth > 0) {
  group.add(slopedWallAlongZ(stairBoxX0, 0.12, stairBoxZ0, stairBoxZ0 + sidePanelDepth, 0, stairWallMat));
  group.add(slopedWallAlongZ(stairBoxX0, 0.12, stairBoxZ1 - sidePanelDepth, stairBoxZ1, 0, stairWallMat));
}
// header above the door - sloped top too, though the roof barely changes height across the door's 0.9m width
group.add(slopedWallAlongZ(stairBoxX0, 0.12, stairBoxCenterZ - doorW / 2, stairBoxCenterZ + doorW / 2, doorH, stairWallMat));
// the door itself
const stairDoor = new THREE.Mesh(new THREE.BoxGeometry(0.06, doorH, doorW - 0.05), stairDoorMat);
stairDoor.position.set(stairBoxX0, deckY + doorH / 2, stairBoxCenterZ);
group.add(stairDoor);

// ---- Water tank compartment: merged with the stair box above into one continuous enclosed room (no wall
// between them anymore). Sized for a large (~3000L+) rooftop tank: 1.6m diameter x 1.8m tall poly tank, with
// clearance to move around it for maintenance/pipework. Walls here also run up to meet the sloped roof. ----
const tankBoxX0 = 6.6, tankBoxX1 = W;         // extended 0.4m further left/east, flush with the stair box above
const tankBoxZ0 = stairBoxZ1, tankBoxZ1 = stairBoxZ1 + 2.0; // 2.0m deep, immediately south of the stair box
const tankBoxCenterX = (tankBoxX0 + tankBoxX1) / 2;
const tankBoxCenterZ = (tankBoxZ0 + tankBoxZ1) / 2;
const tankBoxWidth = tankBoxX1 - tankBoxX0;
const tankBoxDepth = tankBoxZ1 - tankBoxZ0;

// (no north wall here - merged with the stair box above into one room)
// south wall - flat top (fixed z)
const tankWallSH = heightAt(tankBoxZ1);
const tankWallS = new THREE.Mesh(new THREE.BoxGeometry(tankBoxWidth, tankWallSH, 0.12), stairWallMat);
tankWallS.position.set(tankBoxCenterX, deckY + tankWallSH / 2, tankBoxZ1);
group.add(tankWallS);
// east wall: solid, no door (tank room is accessed via the stair box's door/interior, not its own opening) -
// sloped top, with a 0.9m wide window centered in the wall space south of the door, top aligned exactly with
// the door's top (both at doorH = 2.0m above the floor)
const winW = 0.9, winTop = doorH, winH = 1.0, winSillH = winTop - winH;
const doorZ1 = stairBoxCenterZ + doorW / 2;
const winCenterZ = (doorZ1 + tankBoxZ1) / 2;

group.add(slopedWallAlongZ(tankBoxX0, 0.12, tankBoxZ0, winZ0, 0, stairWallMat));           // wall segment left of window

const carportW = 6; // declared early so the low-slope ratio below can reference it
const LOW_SLOPE_RATIO = CANOPY_DROP / carportW; // the carport's gentler slope angle (~5 degrees), reused for the back/right/corner pieces so they match it
function addShade(x0, x1, depth, yTop) {
  const w = x1 - x0;
  const drop = depth * LOW_SLOPE_RATIO;
  const slab = new THREE.Mesh(new THREE.BoxGeometry(w, 0.12, depth), shadeMat);
  slab.position.set((x0 + x1) / 2, yTop - drop / 2, -depth / 2);
  slab.rotation.x = -Math.atan2(drop, depth);
  slab.castShadow = true;
  group.add(slab);
  [x0 + 0.15, (x0 + x1) / 2, x1 - 0.15].forEach((px) => {
    const postH = yTop - drop * ((depth - 0.15) / depth); // slab height at this post's distance from the wall, not the flat wall height
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, postH, 8), postMat);
    post.position.set(px, postH / 2, -depth + 0.15);
    group.add(post);
  });
}

// ---- Continuous wraparound shade roof at ground floor ceiling height, same depth/style as the back (outdoor kitchen) shade ----
const gfShadeY = FLOOR_H - 0.05, gfShadeDepth = 2.5;
function addShadeSide(wall, span0, span1, depthOverride) {
  const span = span1 - span0;
  const depth = depthOverride || gfShadeDepth;
  const isNS = wall === "front" || wall === "back"; // slab runs along X, projects in Z
  const drop = depth * LOW_SLOPE_RATIO; // same ~5 degree slope for every side, including front, so the whole ground-floor canopy reads as one consistent roofline
  const geo = new THREE.BoxGeometry(isNS ? span : depth, 0.12, isNS ? depth : span);
  const slab = new THREE.Mesh(geo, shadeMat);
  slab.castShadow = true;
  const mid = (span0 + span1) / 2;
  const postPositions = [];
  if (wall === "front") {
    slab.position.set(mid, gfShadeY - drop / 2, D + depth / 2);
    slab.rotation.x = Math.atan2(drop, depth);
    postPositions.push([span0 + 0.15, D + depth - 0.15], [mid, D + depth - 0.15], [span1 - 0.15, D + depth - 0.15]);
  } else if (wall === "right") {
    slab.position.set(W + depth / 2, gfShadeY - drop / 2, mid);
    slab.rotation.z = -Math.atan2(drop, depth);
    postPositions.push([W + depth - 0.15, span0 + 0.15], [W + depth - 0.15, span1 - 0.15], [W + depth - 0.15, span0 + span * (1 / 3)], [W + depth - 0.15, span0 + span * (2 / 3)]);
  } else if (wall === "left") {
    slab.position.set(-depth / 2, gfShadeY - drop / 2, mid);
    slab.rotation.z = Math.atan2(drop, depth);
    postPositions.push([-depth + 0.15, span0 + 0.15], [-depth + 0.15, span1 - 0.15]);
  }
  group.add(slab);
  const postH = gfShadeY - drop * ((depth - 0.15) / depth); // slab height at each post's distance from the wall, not the flat wall height
  postPositions.forEach(([px, pz]) => {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, postH, 8), postMat);
    post.position.set(px, postH / 2, pz);
    group.add(post);
  });
}

// ---- Square (90 degree) corner panel: extends both adjacent canopies to meet at a right angle,
// with a hip ridge running from the wall corner (high point) down to the outer corner (low point) ----
const hipCornerMat = new THREE.MeshStandardMaterial({ color: ROOF, roughness: 0.85, side: THREE.DoubleSide });
function addHipCorner(innerX, innerZ, outerX, outerZ, dropZ, dropX, topY) {
  const dropPost = (dropZ + dropX) / 2;
  const geo = new THREE.BufferGeometry();
  const P1 = [innerX, topY, innerZ];               // wall corner - high point
  const P2 = [innerX, topY - dropZ, outerZ];        // low point, matches the Z-facing neighbor's edge height
  const P3 = [outerX, topY - dropPost, outerZ];     // outer corner - low point
  const P4 = [outerX, topY - dropX, innerZ];        // low point, matches the X-facing neighbor's edge height
  const vertices = new Float32Array([
    ...P1, ...P2, ...P3,
    ...P1, ...P3, ...P4,
  ]);
  geo.setAttribute("position", new THREE.BufferAttribute(vertices, 3));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, hipCornerMat);
  mesh.castShadow = true;
  group.add(mesh);

  // support post at the outer corner (P3), inset 0.15m toward the building along each axis, at the slab's actual height there
  const signX = Math.sign(outerX - innerX), signZ = Math.sign(outerZ - innerZ);
  const postH = topY - dropPost;
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, postH, 8), postMat);
  post.position.set(outerX - signX * 0.15, postH / 2, outerZ - signZ * 0.15);
  group.add(post);

  return mesh;
}

const canopyMat = new THREE.MeshStandardMaterial({ color: ROOF, roughness: 0.85 });
const bracketMat = new THREE.MeshStandardMaterial({ color: TRIM });
function addCanopy(wall, span0, span1, topY, projection) {
  const width = span1 - span0;
  const mid = (span0 + span1) / 2;
  const isNS = wall === "front" || wall === "back";
  const geo = new THREE.BoxGeometry(
    isNS ? width + 0.3 : projection,
    0.08,
    isNS ? projection : width + 0.3
  );
  const canopy = new THREE.Mesh(geo, canopyMat);
  canopy.castShadow = true;
  const ffDrop = projection * LOW_SLOPE_RATIO; // same ~5 degree slope as the ground floor canopy, instead of the old fixed 16.7 degree drop
  const brackets = [];
  if (wall === "front") {
    canopy.position.set(mid, topY - ffDrop / 2, D + projection / 2);
    canopy.rotation.x = Math.atan2(ffDrop, projection);
    brackets.push([span0 + 0.1, D + 0.05], [span1 - 0.1, D + 0.05]);
  } else if (wall === "right") {
    canopy.position.set(W + projection / 2, topY - ffDrop / 2, mid);
    canopy.rotation.z = -Math.atan2(ffDrop, projection);
    brackets.push([W + 0.05, span0 + 0.1], [W + 0.05, span1 - 0.1]);
  } else if (wall === "left") {
    canopy.position.set(-projection / 2, topY - ffDrop / 2, mid);
    canopy.rotation.z = Math.atan2(ffDrop, projection);
    brackets.push([-0.05, span0 + 0.1], [-0.05, span1 - 0.1]);
  } else if (wall === "back") {
    canopy.position.set(mid, topY - ffDrop / 2, -projection / 2);
    canopy.rotation.x = -Math.atan2(ffDrop, projection);
    brackets.push([span0 + 0.1, -0.05], [span1 - 0.1, -0.05]);
  }
  group.add(canopy);
  brackets.forEach(([bx, bz]) => {
    const bracket = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.3, 0.04), bracketMat);
    bracket.position.set(bx, topY - 0.15, bz);
    group.add(bracket);
  });
}

addSofa(4.5, D + 0.8, 0);

// two lounge chairs angled inward, facing back toward the sofa across the coffee table
function addChair(x, z, rotY) {
  const g = new THREE.Group();
  const seat = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.12, 0.6), outdoorCushion);
  seat.position.y = 0.4;
  g.add(seat);
  const back = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.1), outdoorCushion);
  back.position.set(0, 0.65, -0.27);
  g.add(back);
  [[-0.25, -0.25], [0.25, -0.25], [-0.25, 0.25], [0.25, 0.25]].forEach(([lx, lz]) => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.4, 6), outdoorWood);
    leg.position.set(lx, 0.2, lz);
    g.add(leg);
  });
  g.position.set(x, 0, z);
  g.rotation.y = rotY;
  g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  group.add(g);
}
addChair(3.3, D + 2.5, Math.PI - 0.35);
addChair(5.7, D + 2.5, Math.PI + 0.35);

const coffeeTable = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.35, 16), outdoorWood);
coffeeTable.position.set(4.5, 0.175, D + 1.7);
coffeeTable.castShadow = true;
group.add(coffeeTable);

// two ceiling fans mounted under the canopy, over the seating area
const fanMat = new THREE.MeshStandardMaterial({ color: "#3a3a3a", roughness: 0.6 });
function addCeilingFan(x, z) {
  const g = new THREE.Group();
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.25, 6), fanMat);
  rod.position.y = gfShadeY - 0.15;
  g.add(rod);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.08, 12), fanMat);
  hub.position.y = gfShadeY - 0.27;
  g.add(hub);
  for (let i = 0; i < 4; i++) {
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.02, 0.1), fanMat);
    blade.position.set(0, gfShadeY - 0.27, 0);
    blade.rotation.y = (Math.PI / 2) * i;
    blade.translateX(0.35);
    g.add(blade);
  }
  g.position.set(x, 0, z);
  g.traverse((o) => { if (o.isMesh) o.castShadow = true; });

}
addCeilingFan(3.5, D + 1.8);
addCeilingFan(5.5, D + 1.8);

// potted plants flanking the outdoor space
function addPottedPlant(x, z, scale) {
  const s = scale || 1;
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.22 * s, 0.17 * s, 0.35 * s, 10), potMat);
  pot.position.set(x, 0.175 * s, z);
  pot.castShadow = true;
  group.add(pot);
  [0, 1].forEach((i) => {
    const foliage = new THREE.Mesh(new THREE.SphereGeometry((0.35 - i * 0.08) * s, 8, 6), plantMat);
    foliage.position.set(x, (0.5 + i * 0.35) * s, z);
    foliage.castShadow = true;
    group.add(foliage);

}
addPottedPlant(0.5, D + 0.6, 1.1);
addPottedPlant(8.5, D + 0.6, 1.1);
addPottedPlant(4.65, D + 3.7, 0.9);


const balX0 = 5.3, balX1 = W; // 5.3m -> east wall, matches Chill Room's width on the front wall
const balDepth = 1.5;
const balZ0 = D, balZ1 = D + balDepth;
const deckMat = new THREE.MeshStandardMaterial({ color: WALL_DARK, roughness: 0.9 });
const railMat = new THREE.MeshStandardMaterial({ color: TRIM });

const balDeck = new THREE.Mesh(
  new THREE.BoxGeometry(balX1 - balX0, 0.15, balDepth),
  deckMat
);
balDeck.position.set((balX0 + balX1) / 2, FLOOR_H - 0.075, (balZ0 + balZ1) / 2);
balDeck.castShadow = true;
balDeck.receiveShadow = true;
group.add(balDeck);

const railH = 1.0, railY = FLOOR_H + railH / 2;
// top rails: left edge, right edge (east wall side), and front edge
const railLeft = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, balDepth), railMat);
railLeft.position.set(balX0, FLOOR_H + railH, (balZ0 + balZ1) / 2);
group.add(railLeft);
const railFront = new THREE.Mesh(new THREE.BoxGeometry(balX1 - balX0, 0.05, 0.05), railMat);
railFront.position.set((balX0 + balX1) / 2, FLOOR_H + railH, balZ1);
group.add(railFront);
const railRight = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, balDepth), railMat);
railRight.position.set(balX1, FLOOR_H + railH, (balZ0 + balZ1) / 2);
group.add(railRight);
// balusters along the front edge
for (let i = 0; i <= 12; i++) {
  const baluster = new THREE.Mesh(new THREE.BoxGeometry(0.03, railH, 0.03), railMat);
  baluster.position.set(balX0 + (i / 12) * (balX1 - balX0), railY, balZ1);
  group.add(baluster);
}
// balusters along the left and right edges
for (let i = 0; i <= 5; i++) {
  const bL = new THREE.Mesh(new THREE.BoxGeometry(0.03, railH, 0.03), railMat);
  bL.position.set(balX0, railY, balZ0 + (i / 5) * balDepth);
  group.add(bL);
  const bR = new THREE.Mesh(new THREE.BoxGeometry(0.03, railH, 0.03), railMat);
  bR.position.set(balX1, railY, balZ0 + (i / 5) * balDepth);
  group.add(bR);
}

// ---- Rooftop terrace balustrade: wraps all 4 sides atop the 0.4m parapet, same bar + top rail design as the balcony ----
const terraceRailMat = new THREE.MeshStandardMaterial({ color: TRIM });
const terraceRailH = 0.7; // bar height above the parapet top
const terraceParapetTopY = H + 0.7; // top of the 0.4m parapet
const terraceRailTopY = terraceParapetTopY + terraceRailH; // 1.1m total above the deck

// top rails, all 4 sides
const trFront = new THREE.Mesh(new THREE.BoxGeometry(roofW, 0.05, 0.05), terraceRailMat);
trFront.position.set(roofCenterX, terraceRailTopY, D + ohFront);
group.add(trFront);
const trBack = new THREE.Mesh(new THREE.BoxGeometry(roofW, 0.05, 0.05), terraceRailMat);
trBack.position.set(roofCenterX, terraceRailTopY, -ohBack);
group.add(trBack);
const trLeft = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, roofD), terraceRailMat);
trLeft.position.set(-ohLeft, terraceRailTopY, roofCenterZ);
group.add(trLeft);
const trRight = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, roofD), terraceRailMat);
trRight.position.set(W + ohRight, terraceRailTopY, roofCenterZ);
group.add(trRight);

// bars, evenly spaced along all 4 sides
const nFrontBack = Math.round(roofW / 0.4);
const nLeftRight = Math.round(roofD / 0.4);
for (let i = 0; i <= nFrontBack; i++) {
  const bx = -ohLeft + (i / nFrontBack) * roofW;
  const barF = new THREE.Mesh(new THREE.BoxGeometry(0.03, terraceRailH, 0.03), terraceRailMat);
  barF.position.set(bx, terraceParapetTopY + terraceRailH / 2, D + ohFront);
  group.add(barF);
  const barB = new THREE.Mesh(new THREE.BoxGeometry(0.03, terraceRailH, 0.03), terraceRailMat);
  barB.position.set(bx, terraceParapetTopY + terraceRailH / 2, -ohBack);
  group.add(barB);
}
for (let i = 0; i <= nLeftRight; i++) {
  const bz = -ohBack + (i / nLeftRight) * roofD;
  const barL = new THREE.Mesh(new THREE.BoxGeometry(0.03, terraceRailH, 0.03), terraceRailMat);
  barL.position.set(-ohLeft, terraceParapetTopY + terraceRailH / 2, bz);
  group.add(barL);
  const barR = new THREE.Mesh(new THREE.BoxGeometry(0.03, terraceRailH, 0.03), terraceRailMat);
  barR.position.set(W + ohRight, terraceParapetTopY + terraceRailH / 2, bz);
  group.add(barR);
}


let theta = Math.PI / 4, phi = 1.1, radius = 22;
let dragging = false, lastX = 0, lastY = 0;
function updateCamera() {
  const cx = radius * Math.sin(phi) * Math.sin(theta);
  const cz = radius * Math.sin(phi) * Math.cos(theta);
  const cy = radius * Math.cos(phi);
  camera.position.set(cx, cy, cz);
  camera.lookAt(0, 2.5, 0);
}
updateCamera();

const dom = renderer.domElement;

// ---- Desktop: mouse drag to rotate, wheel to zoom ----
dom.addEventListener("mousedown", (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener("mouseup", () => { dragging = false; });
window.addEventListener("mousemove", (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  theta -= dx * 0.006;
  phi = Math.min(Math.max(phi - dy * 0.006, 0.35), 1.5);
  lastX = e.clientX; lastY = e.clientY;
  updateCamera();
});
dom.addEventListener("wheel", (e) => {
  e.preventDefault();
  radius = Math.min(Math.max(radius + e.deltaY * 0.02, 10), 40);
  updateCamera();
}, { passive: false });

// ---- Mobile: native touch events, one finger to rotate, two fingers to pinch-zoom ----
let pinchStartDist = 0, pinchStartRadius = 0;
function touchDist(t0, t1) {
  const dx = t0.clientX - t1.clientX, dy = t0.clientY - t1.clientY;
  return Math.sqrt(dx * dx + dy * dy);
}
dom.addEventListener("touchstart", (e) => {
  e.preventDefault();
  if (e.touches.length === 1) {
    dragging = true;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    dragging = false;
    pinchStartDist = touchDist(e.touches[0], e.touches[1]);
    pinchStartRadius = radius;
  }
}, { passive: false });
dom.addEventListener("touchmove", (e) => {
  e.preventDefault();
  if (e.touches.length === 2) {
    const dist = touchDist(e.touches[0], e.touches[1]);
    const scale = pinchStartDist / Math.max(dist, 1);
    radius = Math.min(Math.max(pinchStartRadius * scale, 10), 40);
    updateCamera();
    return;
  }
  if (e.touches.length === 1 && dragging) {
    const dx = e.touches[0].clientX - lastX, dy = e.touches[0].clientY - lastY;
    theta -= dx * 0.006;
    phi = Math.min(Math.max(phi - dy * 0.006, 0.35), 1.5);
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    updateCamera();
  }
}, { passive: false });
dom.addEventListener("touchend", (e) => {
  if (e.touches.length === 1) {
    dragging = true;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  } else {
    dragging = false;
  }
}, { passive: false });
dom.addEventListener("touchcancel", () => { dragging = false; }, { passive: false });

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
dom.addEventListener("pointermove", (e) => {
  if (e.pointerType === "touch" || dragging) {
    labelEl.style.display = "none";
    return;
  }
  const rect = dom.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(group.children, false).filter(h => h.object.userData.label);
  if (hits.length) {
    labelEl.textContent = hits[0].object.userData.label;
    labelEl.style.display = "block";
  } else {
    labelEl.style.display = "none";
  }
});

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  const w = mount.clientWidth, h = mount.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
</script>
